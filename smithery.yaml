# Smithery.ai configuration for PrivacyScrubber MCP Server
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "stdio"
  configSchema:
    type: "object"
    properties:
      PRIVACYSCRUBBER_KEY:
        type: "string"
        title: "PrivacyScrubber License Key"
        description: "Optional PRO, TEAMS, or Developer SDK license key. Leave blank to run on the Free tier."
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@privacyscrubber/mcp-server'],
      env: {
        PRIVACYSCRUBBER_KEY: (config && config.PRIVACYSCRUBBER_KEY) || ''
      }
    })
exampleConfig:
  PRIVACYSCRUBBER_KEY: ""
