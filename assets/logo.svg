<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="crossGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Soft Ambient Glow -->
  <circle cx="64" cy="64" r="48" fill="#3b82f6" opacity="0.32" filter="url(#glow)"/>

  <!-- Outer Shield Border with Gradient -->
  <path d="M64 12 L108 28 L108 60 C108 86 88 106 64 116 C40 106 20 86 20 60 L20 28 Z"
        fill="url(#innerGrad)"
        stroke="url(#shieldGrad)"
        stroke-width="5.5"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Subtle Inner Highlight Rim -->
  <path d="M64 22 L98 34 L98 60 C98 80 82 96 64 104 C46 96 30 80 30 60 L30 34 Z"
        fill="none"
        stroke="rgba(255,255,255,0.15)"
        stroke-width="1.5"/>

  <!-- Core Medical/Security Cross (Brand Icon) -->
  <g filter="url(#crossGlow)">
    <line x1="42" y1="62" x2="86" y2="62" stroke="#38bdf8" stroke-width="11" stroke-linecap="round"/>
    <line x1="64" y1="40" x2="64" y2="84" stroke="#38bdf8" stroke-width="11" stroke-linecap="round"/>

    <line x1="42" y1="62" x2="86" y2="62" stroke="#60a5fa" stroke-width="9" stroke-linecap="round"/>
    <line x1="64" y1="40" x2="64" y2="84" stroke="#60a5fa" stroke-width="9" stroke-linecap="round"/>

    <line x1="44" y1="62" x2="84" y2="62" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.98"/>
    <line x1="64" y1="42" x2="64" y2="82" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.98"/>
  </g>
</svg>
